spring.application.name=everything-app-test

# ============================================================================
# WICHTIG: Diese Datei ueberdeckt src/main/resources/application.properties
# komplett (test-classes liegt im Classpath vor classes). Sie muss daher
# eigenstaendig sein - alles was der Context zum Starten braucht, steht hier.
#
# Grund fuer die Datei: ohne sie liefen die Tests gegen die echte Dev-Datenbank
# everything_app und haetten dort Daten angelegt bzw. den Uebungs-Seeder
# ausgefuehrt.
# ============================================================================

# In-Memory-Datenbank statt der Dev-Postgres
spring.datasource.url=jdbc:h2:mem:everything_app_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Uebungs-Katalog nicht seeden: 873 Datensaetze pro Testlauf waeren langsam und
# die H2-Datenbank ist ohnehin nach jedem Lauf wieder weg.
app.exercise-seed.enabled=false

# JWT (Testwert, nicht der Produktiv-Key)
jwt.secret=dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtb25seS1uZXZlci11c2VkLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg5MA==
jwt.expiration=2592000000

logging.level.root=WARN
logging.level.com.Finn.everything_app=INFO
logging.level.org.hibernate.SQL=WARN

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Europe/Berlin
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

spring.devtools.restart.enabled=false

# ---- Smart Scheduler ----
scheduler.solver-time-limit-seconds=10.0
scheduler.horizon-days=14
scheduler.debounce-ms=2000
scheduler.max-delay-ms=15000
