# ============================================================================
# Produktionsprofil. Aktiv ueber SPRING_PROFILES_ACTIVE=prod (setzt compose.yaml).
#
# Diese Datei ist eingecheckt und enthaelt bewusst KEINE Geheimnisse - alles
# Vertrauliche kommt aus Umgebungsvariablen, die docker compose aus der .env
# neben der compose.yaml zieht.
#
# Sie ueberlagert application.properties nur dort, wo unten etwas steht; alles
# andere (Scheduler-Budget, Jackson, Seeder) gilt weiter aus der Basisdatei.
# ============================================================================

# ---- Datenbank -------------------------------------------------------------
# "db" ist der Servicename aus compose.yaml, aufloesbar nur im Docker-Netz.
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/everything_app}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Bleibt vorerst auf "update": ein einzelner Nutzer, und ein Rollback kostet mit
# dem Backup aus scripts/ea-backup.sh fuenf Minuten. Deshalb faehrt scripts/deploy.sh
# vor jedem Neubau ein Backup - das ist nicht optional, solange hier "update" steht.
# Umstieg auf Flyway, sobald die Entities stabil sind.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Auth ------------------------------------------------------------------
# HS256 braucht >= 32 Byte Schluesselmaterial, sonst wirft Keys.hmacShaKeyFor beim Start.
jwt.secret=${JWT_SECRET}
# 30 Tage. Ohne Token-Widerruf ist das die Zeit, die ein abhanden gekommenes Token
# gueltig bleibt; Notausschalter ist bis dahin ein Wechsel von JWT_SECRET.
jwt.expiration=${JWT_EXPIRATION:2592000000}

# ---- Betriebsmodus ---------------------------------------------------------
# Alle drei sind der Kern der Absicherung. dev-login=false laesst DevAuthController
# gar nicht erst als Bean entstehen, der Pfad ist dann schlicht 404.
app.dev-login.enabled=false
# Einmalig auf true fuer das Anlegen des eigenen Accounts, danach wieder aus.
app.registration.enabled=${APP_REGISTRATION_ENABLED:false}
app.demo-seed.enabled=false
# Leer: Web-App und API liegen hinter Caddy auf derselben Origin, CORS entfaellt.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ---- Hinter Reverse Proxy / Cloudflare -------------------------------------
# Damit request.getRemoteAddr() im LoginRateLimitFilter die echte Client-IP aus
# X-Forwarded-For liefert und nicht die von Caddy. Unbedenklich, weil das Backend
# kein Port-Mapping hat und nur Caddy es im Docker-Netz erreicht.
server.forward-headers-strategy=NATIVE

# ---- Bankanbindung ---------------------------------------------------------
# "demo" liefert Beispieldaten ohne Zugangsdaten; auf "live" umstellen, sobald der
# private Schluessel liegt und die Application-ID gesetzt ist.
enablebanking.provider=${EB_PROVIDER:demo}
enablebanking.application-id=${EB_APP_ID:}
# Wird per read-only-Mount aus ${HOME}/.everything-app/enablebanking.pem gefuellt.
enablebanking.private-key-path=/run/secrets/enablebanking.pem
# Muss im Enable-Banking-Control-Panel EXAKT so hinterlegt sein, sonst lehnt die Bank ab.
enablebanking.redirect-url=https://${APP_DOMAIN}/api/finance/bank/callback

# ---- Logging ---------------------------------------------------------------
logging.level.root=INFO
logging.level.com.Finn.everything_app=INFO
logging.level.org.hibernate.SQL=WARN
