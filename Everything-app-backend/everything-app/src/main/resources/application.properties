spring.application.name=everything-app

# ============================================================================
# Basiskonfiguration - EINGECHECKT und bewusst frei von Geheimnissen.
#
# Die Werte hier sind auf lokale Entwicklung eingestellt. In Produktion ueberlagert
# application-prod.properties (SPRING_PROFILES_ACTIVE=prod) alles Relevante; die
# getunten Scheduler- und Jackson-Werte weiter unten gelten dort unveraendert weiter.
# Genau dafuer muss diese Datei in der Versionsverwaltung liegen - auf dem Server
# entsteht das Image aus einem git clone, eine ignorierte Datei waere dort schlicht weg.
#
# Passwort und JWT-Secret stehen in application-secrets.properties im Modulwurzel-
# verzeichnis (nicht eingecheckt, Vorlage: application-secrets.properties.example).
#
# Bewusst "file:" neben dem Projekt statt "classpath:" in resources/: eine Datei
# unter src/main/resources landet in jedem Jar, das hier gebaut wird - auch in
# einem, den man versehentlich weitergibt. So kann sie das gar nicht erst.
# In Produktion existiert sie nicht, deshalb "optional:".
# ============================================================================
spring.config.import=optional:file:./application-secrets.properties

# Lokale Dev-Postgres (angelegt am 2026-08-07, Rolle+DB "everything_app")
spring.datasource.url=jdbc:postgresql://localhost:5432/everything_app
spring.datasource.username=everything_app
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - das Secret kommt aus application-secrets.properties
jwt.expiration=2592000000

# ---- Betriebsmodus (Entwicklung) ----
# Alle drei sind in application-prod.properties abgeschaltet bzw. leer.
# dev-login: passwortloses Token fuer "dev_tester". Steuert zugleich, ob
# DevAuthController ueberhaupt als Bean entsteht - false heisst 404 statt 403.
app.dev-login.enabled=true
app.registration.enabled=true
# Der Flutter-Web-Client im Dev-Betrieb laeuft auf einem zufaelligen localhost-Port.
app.cors.allowed-origins=http://localhost:*

logging.level.root=INFO
logging.level.com.Finn.everything_app=DEBUG
logging.level.org.hibernate.SQL=WARN

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Europe/Berlin
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# ---- Smart Scheduler ----
# Zeitbudget des Solvers (Phase 1 bekommt 35%, Phase 2 65%).
#
# Dieser Wert ist praktisch die Untergrenze der Wartezeit nach einem Verschieben: der Loeser
# beweist bei realistischem Bestand nie Optimalitaet und schoepft das Budget deshalb immer voll
# aus. Frueher standen hier 10s.
#
# 1.5s ist gemessen, nicht geraten: die Verteilung der Trainings steckt seit dem Ruhetag als
# harte Constraint schon in der ersten zulaessigen Loesung, und Phase 2 startet ueber die Hints
# auf den Wunschzeiten der Gewohnheiten. Der Demo-Bestand liefert damit ab 1.0s dasselbe
# Ergebnis wie mit 20s; 1.5s laesst Luft fuer volle Kalender.
scheduler.solver-time-limit-seconds=1.5
# Passt zu dem, was der Kalender anzeigt (ganze Monate). Bei 14 Tagen plante der Solver deutlich
# weniger weit, als der Nutzer sehen und per Drag-and-Drop erreichen kann.
# Task-Bloecke bleiben ueber scheduler.task-horizon-days weiterhin auf 14 Tage begrenzt.
scheduler.horizon-days=31
# Ruhephase der Entprellung. Bewusst kurz: sie liegt vollstaendig VOR dem Solverlauf und damit
# direkt im Wartebalken des Nutzers, nachdem er einen Block verschoben hat.
scheduler.debounce-ms=400
scheduler.max-delay-ms=15000

# Demo-Provider fuer die Bankanbindung (keine echten Enable-Banking-Zugangsdaten vorhanden)
enablebanking.provider=demo

# Rezept-Import von Instagram: mit der Kennung eines Suchmaschinen-Crawlers abrufen.
# Instagram gibt Crawlern die og-Angaben heraus und einem normalen Abrufer meist eine
# Anmeldeseite - die Trefferquote steigt damit deutlich. Es behauptet gegenueber Instagram
# aber, etwas zu sein, das man nicht ist, und verstoesst gegen deren Bedingungen. Deshalb
# aus: das soll eine bewusste Entscheidung sein und keine stille Voreinstellung.
# Scheitert der Abruf, fuehrt der Import ohnehin sauber zum Einfuegen der Bildunterschrift.
app.recipe-import.instagram.crawler-ua=false
